name: Validate SHOA weak-current windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_weak_windows.py' -v
      - run: python -c 'from app import all_qa; r=all_qa(); print({k:v.get("pass") for k,v in r.items() if isinstance(v,dict)}, flush=True); print(r["timezones"],flush=True); assert r["pass"]'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install && npm run build
        working-directory: web
  timezone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -c 'from app import timezone_qa; import json; print(json.dumps(timezone_qa(),indent=2),flush=True)'
