name: Validate SHOA weak-current windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_weak_windows.py' -v
      - run: python -m unittest discover -s tests -p 'test_api_contracts.py' -v
      - run: python -m unittest discover -s tests -p 'test_current_window_safety.py' -v
      - run: python -m unittest discover -s tests -p 'test_user_journey.py' -v
      - run: python -c 'from app import all_qa; r=all_qa(); print({k:v.get("pass") for k,v in r.items() if isinstance(v,dict)}, flush=True); print(r["timezones"],flush=True); assert r["pass"]'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install && npm run build
        working-directory: web
  timezone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -c 'from app import timezone_qa; import json; r=timezone_qa(); print(json.dumps(r,indent=2),flush=True); assert r["pass"], "Timezone QA failed"'
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed API and frontend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 10 --max-time 90 --silent --show-error https://estoa-api.onrender.com/health | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r); assert r["status"]=="ok"'
          curl --fail --location --retry 4 --retry-delay 10 --max-time 90 --silent --show-error https://estoa-web.onrender.com/ | grep -qi '<html'
