name: Private transport tests
on:
  pull_request:
  push:
    branches: [feature/accounts-foundation]
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test web/tests/privateApi.test.mjs
