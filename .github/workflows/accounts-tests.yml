name: Accounts tests
on:
  push:
    branches: [feature/accounts-foundation]
  pull_request:
    paths:
      - 'accounts*.py'
      - 'migrations/**'
      - 'tests/test_accounts*.py'
      - '.github/workflows/accounts-tests.yml'
      - 'requirements.txt'
jobs:
  accounts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: estoa_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U test -d estoa_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ESTOA_DATABASE_URL: postgresql://test:test@localhost:5432/estoa_test
      ESTOA_TEST_DATABASE: "1"
      ESTOA_RATE_LIMIT_SECRET: disposable-ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx
      - run: |
          python - <<'PY'
          import os, pathlib, psycopg
          for path in sorted(pathlib.Path("migrations").glob("*.sql")):
              with psycopg.connect(os.environ["ESTOA_DATABASE_URL"], autocommit=True) as conn:
                  conn.execute(path.read_text())
          PY
      - run: python -m unittest discover -s tests -p 'test_accounts*.py' -v
