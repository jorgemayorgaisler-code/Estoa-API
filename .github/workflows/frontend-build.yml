name: ESTOA frontend build
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/frontend-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Build isolated commercial preview
        working-directory: web
        env:
          VITE_COMMERCIAL_PREVIEW: 'true'
          VITE_ACCOUNTS_PREVIEW: 'true'
          VITE_EMAIL_PREVIEW: 'true'
          VITE_TERMS_PREVIEW: 'true'
          VITE_DELETION_PREVIEW: 'true'
          VITE_PAYMENT_PREVIEW: 'true'
          VITE_ACCOUNTS_API: 'https://preview.example.invalid'
        run: npm run build
